name: Build Windows release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Windows x86_64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out requested commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Python 3.11.9 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11.9"
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-build-windows.txt

      - name: Install pinned build dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build-windows.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Windows-compatible tests and lint
        shell: pwsh
        run: ./scripts/test-windows-release.ps1

      - name: Build and smoke-test Windows release
        shell: pwsh
        run: ./scripts/build-windows-release.ps1

      - name: Upload verified Windows release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: toolbox-windows-release-${{ github.sha }}
          path: |
            dist-windows/*.exe
            dist-windows/*.exe.sha256
            dist-windows/*.zip
            dist-windows/*.zip.sha256
          if-no-files-found: error
          retention-days: 7
