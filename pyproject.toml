[tool.ruff]
line-length = 99
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.black]
line-length = 99
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 99

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = [
    "unit: isolated unit tests",
    "integration: tests spanning multiple application components",
    "gui: Qt GUI lifecycle tests",
    "appimage: AppDir and AppImage acceptance tests",
    "slow: tests that intentionally perform slower filesystem or process work",
]
